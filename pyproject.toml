[project]
name = "downloader"
version = "0.1.0"
description = "Gestor de descargas de video resiliente basado en yt-dlp"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.3",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
downloader = "downloader.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "ffmpeg: requiere ffmpeg y ffprobe en el PATH",
    "slow: tarda más de unos 5 s; los tests rápidos se ejecutan con -m \"not slow\"",
    "ytdlp_internals: depende del comportamiento interno de yt-dlp; `downloader actualizar` los ejecuta antes de aceptar una versión nueva",
]
